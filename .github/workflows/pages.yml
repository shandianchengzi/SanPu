name: SanPu — Tests and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install packaging tools
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Prepare versioned web bundle
        env:
          SANPU_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build:web
      - name: Verify static assets
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/src/app.mjs
          test -s dist/src/core.mjs
          test -s dist/src/timbres.mjs
          test -s dist/src/update.mjs
          test -s dist/build-info.json
          test -s dist/LICENSE
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare deployable web bundle
        env:
          SANPU_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
