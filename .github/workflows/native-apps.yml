name: SanPu — EXE and APK packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shared web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify versioned web bundle
        env:
          SANPU_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build:web

  windows:
    name: Build Windows EXE
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Set build version
        shell: pwsh
        run: npm version "1.0.${env:GITHUB_RUN_NUMBER}" --no-git-tag-version
      - name: Build NSIS installer
        env:
          SANPU_BUILD_COMMIT: ${{ github.sha }}
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: SanPu-Windows-EXE-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Set build version
        run: npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - name: Select preinstalled Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            latest_ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            test -n "$latest_ndk"
            echo "NDK_HOME=$latest_ndk" >> "$GITHUB_ENV"
          fi
      - name: Initialize Android wrapper
        run: npx tauri android init --ci
      - name: Build installable APK in GitHub Actions
        env:
          SANPU_BUILD_COMMIT: ${{ github.sha }}
        run: npx tauri android build --debug --apk --target aarch64 --target armv7 --target x86_64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: SanPu-Android-APK-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  package:
    name: Combine installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SanPu-*-${{ github.sha }}
          path: installers
          merge-multiple: true
      - name: List packaged applications
        run: find installers -maxdepth 5 -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: SanPu-EXE-and-APK-${{ github.sha }}
          path: installers
          if-no-files-found: error
          retention-days: 30
